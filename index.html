<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nammal Fit — Clickable Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Noto+Sans+Malayalam:wght@500&display=swap">
<style>
:root{--bg:#0F1A14;--card:#16241B;--gold:#C9A227;--cream:#F3EAD3;--green:#2E6B3F;--line:#34493A;--muted:#B9B39E;--dash:#7C8B7D;--warn:#E08A6A}
*{box-sizing:border-box}
html,body{margin:0;background:#0a120d;color:var(--cream);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.4}
button,input,select{font-family:inherit}
h1{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin:0;font-weight:700}
h2{font-family:'Playfair Display',Georgia,serif;font-size:18px;margin:0;color:var(--gold)}
.bar{position:sticky;top:0;z-index:5;background:#0a120d;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px}
.bar b{font-family:'Playfair Display',serif;color:var(--gold);font-size:16px;margin-right:auto}
.pill{border:1px solid var(--dash);background:transparent;color:var(--cream);border-radius:999px;padding:0 14px;min-height:36px;font-weight:600;font-size:12px;cursor:pointer}
.pill.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.phone{max-width:420px;margin:0 auto;min-height:calc(100vh - 54px);background:var(--bg);display:flex;flex-direction:column;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.head{padding:16px 18px 6px}
.sub{color:var(--muted);font-size:13px}
.main{flex:1;padding:8px 14px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:12px}
.big{font-size:17px;font-weight:600}
.gold{color:var(--gold)}
.btn{min-height:46px;border-radius:10px;font-size:14px;font-weight:600;padding:0 14px;cursor:pointer;border:1px solid var(--gold);background:var(--gold);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--gold)}
.btn.sm{min-height:40px;font-size:13px;padding:0 10px}
.btn.full{width:100%}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--dash);color:var(--muted)}
.tag.ok{background:var(--green);border-color:var(--green);color:var(--cream)}
.tag.pend{border:1px dashed var(--gold);color:var(--gold)}
.tag.gold{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.tag.warn{border-color:var(--warn);color:var(--cream)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{min-height:40px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--dash);background:transparent;color:var(--cream)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:8px;background:var(--gold)}
.prog.g i{background:var(--green)}
.tabs{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px 10px}
.tabs button{flex:1;min-height:52px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center}
.tabs button i{width:20px;height:20px;border:2px solid currentColor;border-radius:6px}
.tabs button.on{color:var(--gold)}
.tabs button.on i{background:var(--gold)}
.av{width:28px;height:28px;border-radius:50%;border:1px solid var(--dash);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex-shrink:0}
.who{display:flex;align-items:center;gap:8px}
.ph{height:88px;border:1px dashed var(--dash);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
input[type=number],input[type=text],select{min-height:44px;border-radius:8px;border:1px solid var(--dash);background:var(--bg);color:var(--cream);font-size:15px;padding:0 10px;width:100%}
input[type=range]{width:100%;accent-color:var(--gold)}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--cream);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;max-width:90vw;z-index:9}
.back{background:none;border:0;color:var(--gold);font-size:13px;cursor:pointer;padding:0;min-height:36px;text-align:left}
.star{width:26px;height:26px;border-radius:50%;border:2px solid var(--dash);background:transparent;cursor:pointer;padding:0}
.star.on{background:var(--gold);border-color:var(--gold)}
.heat{display:grid;grid-template-columns:repeat(18,1fr);gap:3px}
.heat span{aspect-ratio:1;border-radius:3px;background:var(--line)}
.admin{display:flex;flex-wrap:wrap;min-height:calc(100vh - 54px);background:var(--bg)}
.admin nav{flex:1 1 180px;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.admin nav button{min-height:42px;text-align:left;border:0;border-radius:8px;background:none;color:var(--cream);font-weight:600;font-size:14px;padding:0 12px;cursor:pointer}
.admin nav button.on{background:var(--gold);color:var(--bg)}
.admin main{flex:999 1 520px;min-width:0;padding:20px;display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.lvlbar{display:grid;grid-template-columns:64px 1fr 44px;gap:8px;align-items:center;font-size:12px}
.ml{font-family:'Noto Sans Malayalam',sans-serif;color:var(--gold);font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- sample data and rules (everything is in memory; reload resets) ----------
const ACT={Walk:['end',2],Run:['end',3],Hike:['end',2],Biking:['end',2],Swim:['end',3],Badminton:['sp',3],Tennis:['sp',3],'Table Tennis':['sp',2],Pickleball:['sp',2],Cricket:['sp',2],Gym:['tr',2],Yoga:['tr',1],Zumba:['tr',2],Bootcamp:['tr',3]};
const TYPE={end:'Endurance',sp:'Sports',tr:'Training and classes'};
const CH=[
 {id:'mile',name:'1-Mile Running',target:'Under 13 min by year-end',min:'Monthly: 1 group mile run',imp:'Improve 5 sec a month, 1 min a year',now:'Best mile: 13:40',pct:62,period:'This month',done:true},
 {id:'walk5k',name:'5K Walking',target:'15 min/mi pace by year-end',min:'Monthly: 1 group 5K walk',imp:'Improve 5 sec/mi a month, 1 min/mi a year',now:'Current pace: 16:10 min/mi',pct:55,period:'This month',done:false},
 {id:'run10k',name:'10K Running',target:'11 min/mi pace by year-end',min:'Quarterly: 1 group 10K run',imp:'Improve 1 min/mi by year-end',now:'Current pace: 11:50 min/mi',pct:48,period:'This quarter',done:true},
 {id:'gym',name:'Gym',target:'48 sessions a year',min:'Monthly: 4 group gym sessions',imp:'Sessions 30 to 45 min; add 1 to 2 min a month',now:'9 of 48 sessions',pct:19,period:'This month',done:false},
 {id:'bike',name:'Biking',target:'2 rides of 50 miles',min:'Quarterly: 1 group cycling activity',imp:'The two 50-mile rides must be 4+ months apart',now:'0 of 2 rides; longest 28 miles',pct:28,period:'This quarter',done:true},
 {id:'swim',name:'Swimming',target:'100 yards minimum per session',min:'Monthly: 1 group swim session',imp:'Build distance and endurance',now:'Last session: 150 yards',pct:70,period:'This month',done:true},
 {id:'weight',name:'Weight Management',target:'Lose 10 lb in the first 6 months',min:'3 weigh-ins a year; no group requirement',imp:'Maintain the loss through year-end',now:'Weigh-ins recorded: 1 of 3',pct:33,period:'Baseline weigh-in',done:true,priv:true},
 {id:'credits',name:'General 50 Credits',target:'50 credits a year',min:'Quarterly: at least 10 credits',imp:'Badminton, tennis, cricket, walking, running and more',now:'14 credits so far',pct:28,period:'This quarter',done:true}
];
const S={signed:false,role:'member',adminTab:'Dashboard',goal:150,weekMin:110,verified:340,weeksClosed:2,ringDone:false,
 level:{end:2,sp:2,tr:1},trApproved:false,challenge:'mile',exception:null,volunteer:'none',
 rules:{light:1,mod:2,vig:3,cap:150,below:0.75,at:1,one:1.25,two:1.5,goalBonus:100},
 log:{act:'Walk',min:45,miles:2.5,method:'photo'},
 ex:{act:'Walk',min:45,eff:2,diff:2,lvl:1},
 feed:[{who:'Member A',what:'Run · 40 min · Run circle',pts:120,ok:true,cheers:12,photo:true},{who:'Member D',what:'Walk · 45 min · Squad Periyar',pts:90,ok:false,cheers:7,photo:true},{who:'Member B',what:'Gym · 60 min',pts:96,ok:true,cheers:5}],
 queue:[{id:1,who:'Member D',act:'Walk',min:45,ev:'Photo',pts:90},{id:2,who:'Member J',act:'Gym',min:60,ev:'Photo',pts:120},{id:3,who:'Member K',act:'Yoga',min:50,ev:'None',pts:50}],
 nextId:10,rsvp:{},poll:{a:11,b:6,voted:null},registered:false,matchDone:false,showHealth:false,
 kids:[{name:'Child 1',band:'Rising Stars · ages 8 to 10',goal:'60 active minutes a day',stars:5},{name:'Child 2',band:'Tiny Champs · ages 3 to 4',goal:'180 minutes of play, 60 energetic',stars:3}],
 kidPriv:{name:true,photo:false},
 dues:[{t:'Annual dues',s:'Nammal year 2026 to 2027',paid:false},{t:'Turkey Trot team entry',s:'Paid by Zelle',paid:true}],
 members:[['Member A','1-Mile Running','Met','On track'],['Member B','Gym','2 of 4 sessions','Behind'],['Member C','General 50 Credits','12 of 10 credits','On track'],['Member D','5K Walking','Not yet','Make-up due'],['Member E','Weight Management','Weigh-in recorded','On track'],['Member F','No challenge','—','$100 contribution']]
};
let route='signin',toastT=null;
const $=s=>document.querySelector(s);
const pending=()=>S.queue.filter(q=>q.who==='You').reduce((a,q)=>a+q.pts,0);
function toast(m){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}
function ring(p,big,small,size){const r=size/2-9,c=2*Math.PI*r;p=Math.min(100,p);return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0"><svg role="img" aria-label="${big} ${small}" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#34493A" stroke-width="10"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#C9A227" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:${Math.round(size/5.2)}px;font-weight:600">${big}</div><div class="muted" style="font-size:11px">${small}</div></div></div>`}
const who=(n,s)=>`<div class="who"><span class="av">${n.split(' ').pop()[0]}</span><div><div>${n}</div>${s?`<div class="muted">${s}</div>`:''}</div></div>`;
const prog=(p,g)=>`<div class="prog ${g?'g':''}"><i style="width:${Math.min(100,p)}%"></i></div>`;
const effName=e=>['','light','moderate','vigorous'][e];
const effVal=e=>[0,S.rules.light,S.rules.mod,S.rules.vig][e];
function chMult(diff,lvl){const d=diff-lvl;return d<0?S.rules.below:d===0?S.rules.at:d===1?S.rules.one:S.rules.two}
function calcLog(){const l=S.log,def=ACT[l.act][1];let eff,ch,note,ok;
 if(l.method==='qr'){eff=def;ch=S.rules.one;note='Session set one above your level by the organizer';ok=true}
 else if(l.method==='partner'){eff=def;ch=S.rules.one;note='Opponent is one level higher';ok=true}
 else{eff=Math.min(def,2);ch=S.rules.at;note='Challenge is set by the admin';ok=false}
 const base=Math.min(l.min*effVal(eff),S.rules.cap);return {eff,ch,note,ok,base,pts:Math.round(base*ch)}}
function addMinutes(m,p){S.weekMin+=m;S.verified+=p;if(!S.ringDone&&S.weekMin>=S.goal){S.ringDone=true;S.weeksClosed++;S.verified+=S.rules.goalBonus;setTimeout(()=>toast('Weekly ring closed! +'+S.rules.goalBonus+' points. Annual ring: '+S.weeksClosed+' of 40'),300)}}

// ---------- member screens ----------
const V={};
V.signin=()=>`<div class="main" style="justify-content:center;gap:14px"><div style="align-self:center;width:92px;height:92px;border:1px dashed var(--dash);border-radius:22px;display:flex;align-items:center;justify-content:center" class="muted">Logo</div><h1 style="text-align:center;font-size:34px">Nammal Fit</h1><div class="ml" style="text-align:center" lang="ml">നമ്മൾ</div><div class="sub" style="text-align:center">Move together. Every level counts.</div><button class="btn" data-go="onboard">Sign in with Face ID</button><button class="btn sec" data-go="onboard">Use fingerprint</button><button class="btn sec" data-go="onboard">Email me a sign-in link</button><button class="btn sec" data-go="onboard">Text me a code</button><div class="muted" style="text-align:center">Prototype: any button signs you in as a sample member. Face and fingerprint checks would stay on your phone.</div></div>`;
V.onboard=()=>`<div class="head"><h1>Set your fitness level</h1><div class="sub">Step 3 of 4 · about a minute</div></div><div class="main">${prog(75)}<div class="card"><div class="row"><b>Strava</b><span class="tag ok">Linked (sample)</span></div><div class="muted">We read your last 12 months. Only you see the details.</div></div><div class="card"><div class="lab">Suggested levels</div>${Object.keys(TYPE).map(k=>`<div class="row"><span>${TYPE[k]}</span><span class="tag">Level ${S.level[k]}</span></div>`).join('')}</div><div class="card"><div class="lab">Pick your best evidence</div><label style="flex-direction:row;align-items:center;gap:10px;min-height:40px;color:var(--cream);font-size:14px"><input type="radio" name="ev" checked style="width:18px;min-height:18px"> 5K walk, 49:30 · Strava · 3 weeks ago</label><label style="flex-direction:row;align-items:center;gap:10px;min-height:40px;color:var(--cream);font-size:14px"><input type="radio" name="ev" style="width:18px;min-height:18px"> Race result link</label><label style="flex-direction:row;align-items:center;gap:10px;min-height:40px;color:var(--cream);font-size:14px"><input type="radio" name="ev" style="width:18px;min-height:18px"> No app: answer 4 questions</label></div><div class="muted">An admin approves your level. Until then you earn at the standard rate.</div><button class="btn" data-act="finishOnboard">Send for approval</button></div>`;
V.home=()=>{const c=CH.find(x=>x.id===S.challenge),left=Math.max(0,S.goal-S.weekMin),lg=league();return `<div class="head"><h1>Good morning</h1><div class="sub">Sample member · Winter season, week 2</div></div><div class="main">
<div class="card"><div style="display:flex;gap:14px;align-items:center">${ring(S.weekMin/S.goal*100,S.weekMin,'of '+S.goal+' min',108)}<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div class="lab">My weekly ring</div><b>${left?left+' minutes to close your ring':'Ring closed this week'}</b><div class="muted">Squad ring: 7 of 9 members on track</div>${prog(78,1)}</div></div></div>
<div class="grid2"><div class="card"><div class="lab">Points this week</div><div class="big">${S.verified} verified</div><div class="muted gold">${pending()} awaiting admin</div></div><div class="card"><div style="display:flex;gap:10px;align-items:center">${ring(S.weeksClosed/40*100,S.weeksClosed,'of 40',64)}<div><div class="lab">Annual ring</div><div class="muted">Weekly rings closed since 1 Nov</div></div></div></div></div>
<div class="card"><div class="row"><div class="lab">My challenge</div><span class="tag ${c.done&&!S.exception?'ok':'pend'}">${S.exception?'Request with admin':c.done?'On track':'Minimum not met yet'}</span></div><div class="row"><b>${c.name}</b><span class="muted">${c.target}</span></div>${prog(c.pct)}<button class="btn sec sm" data-go="challenge">Open my challenge</button></div>
<div class="card"><div class="lab">Next for you</div><div class="row"><b>Badminton doubles</b><span class="tag">Tonight 7:00</span></div><div class="muted">Community centre court 2 · ${6+(S.rsvp.bad?1:0)} going · your level</div><div class="grid2"><button class="btn sm ${S.rsvp.bad?'sec':''}" data-act="rsvp" data-k="bad">${S.rsvp.bad?'You are in ✓':'I am in'}</button><button class="btn sec sm" data-go="together">Details</button></div></div>
<div class="card"><div class="row"><div class="lab">My mini-league</div><span class="muted">Resets Monday</span></div>${lg.slice(0,4).map((m,i)=>`<div class="row">${who((i+1)+'. '+m[0])}<b class="${m[0]==='You'?'gold':''}">${m[1]}</b></div>`).join('')}</div>
<div class="grid2"><button class="btn sec sm" data-go="feed">Feed</button><button class="btn sec sm" data-go="explain">How points work</button></div></div>`};
const league=()=>[['Member A',412],['You',S.verified],['Member B',298],['Member C',255],['Member E',190]].sort((a,b)=>b[1]-a[1]);
V.log=()=>{const l=S.log,c=calcLog();return `<div class="head"><h1>Log activity</h1><div class="sub">Pick it, enter minutes, choose how it is verified</div></div><div class="main">
<div class="card"><div class="lab">Activity</div><div class="grid4">${Object.keys(ACT).map(a=>`<button class="chip ${l.act===a?'on':''}" data-act="setAct" data-k="${a}">${a}</button>`).join('')}</div></div>
<div class="card"><div class="grid2"><label>Minutes<input type="number" id="lmin" min="5" max="300" value="${l.min}"></label><label>Distance (miles or yards)<input type="number" id="lmi" step="0.1" value="${l.miles}"></label></div><div class="muted">No effort score to fill in. Devices and organizers set effort; otherwise an admin awards the points.</div></div>
<div class="card"><div class="lab">How is it verified?</div><div class="grid2">${[['qr','Scan session QR'],['partner','Partner confirms'],['photo','Watch or app photo'],['none','No proof']].map(m=>`<button class="chip ${l.method===m[0]?'on':''}" data-act="setMethod" data-k="${m[0]}">${m[1]}</button>`).join('')}</div><div class="muted">${c.ok?'Verified at once. Points count straight away.':'Goes to an admin, who reviews it and awards the points.'}</div></div>
<div class="card"><div class="row"><div class="lab">Points receipt</div><button class="back" data-go="explain">How points work</button></div><div class="row"><span>${l.min} min × ${effName(c.eff)} (${effVal(c.eff)})${l.min*effVal(c.eff)>S.rules.cap?' · capped':''}</span><span>${c.base}</span></div><div class="row"><span>${c.note}</span><span>× ${c.ch}</span></div><div class="row"><b>${c.ok?'Total':'Proposed'}</b><span><b class="gold" style="font-size:17px">${c.pts}</b> <span class="tag ${c.ok?'ok':'pend'}">${c.ok?'Verified':'Admin awards'}</span></span></div></div>
<button class="btn" data-act="saveLog">Save check-in</button></div>`};
V.feed=()=>`<div class="head"><h1>Feed</h1><div class="sub">Check-ins and news from Nammal</div></div><div class="main"><div class="card"><div class="row"><div class="lab">Announcement</div><span class="tag">Admin</span></div><div>Putt Ottam 5K is in September. Kids' dash for every age band.</div></div>${S.feed.map((f,i)=>`<div class="card"><div class="row">${who(f.who,f.what)}<span class="tag ${f.ok?'ok':'pend'}">${f.ok?'Verified':'Pending'}</span></div>${f.photo?'<div class="ph">Workout photo</div>':''}<div class="row"><button class="btn sec sm" data-act="cheer" data-k="${i}">Cheer · ${f.cheers}</button><b class="gold">+ ${f.pts}</b></div></div>`).join('')}</div>`;
V.boards=()=>`<div class="head"><h1>Boards</h1><div class="sub">Nammal year: 1 Nov to 31 Oct</div></div><div class="main"><div class="card"><div class="row"><div class="lab">My mini-league</div><span class="muted">5 similar members · resets Monday</span></div>${league().map((m,i)=>`<div class="row" style="min-height:34px">${who((i+1)+'. '+m[0])}<b class="${m[0]==='You'?'gold':''}">${m[1]}</b></div>`).join('')}</div><div class="card"><div class="row"><div class="lab">Squads</div><span class="muted">Average points per member</span></div>${[['Squad Periyar',286],['Squad Pamba',271],['Squad Nila',240]].map((m,i)=>`<div class="row" style="min-height:34px">${who((i+1)+'. '+m[0])}<b>${m[1]}</b></div>`).join('')}</div><div class="card"><div class="lab">Annual ring leaders</div>${[['Member C',3],['You',S.weeksClosed],['Member A',2]].sort((a,b)=>b[1]-a[1]).map((m,i)=>`<div class="row">${who((i+1)+'. '+m[0])}<b class="${m[0]==='You'?'gold':''}">${m[1]} of 40 weeks</b></div>`).join('')}</div><div class="muted">Boards show points and rings only. Levels and health data stay private. Prizes are decided and given by admins at Nammal Day.</div></div>`;
V.together=()=>{const p=S.poll,tot=p.a+p.b;return `<div class="head"><h1>Together</h1><div class="sub">Sessions, polls, events and tournaments</div></div><div class="main">
${[['bad','Badminton doubles','Tonight 7:00 pm',6,'of 8 going · carpool: 2 seats'],['walk','Saturday group 5K walk','Sat 8:00 am',14,'going · counts for the 5K Walking challenge'],['mile','Monthly group mile run','Sun 7:30 am',9,'going · counts for the 1-Mile challenge']].map(s=>`<div class="card"><div class="row"><b>${s[1]}</b><span class="tag">${s[2]}</span></div><div class="row"><span class="muted">${s[3]+(S.rsvp[s[0]]?1:0)} ${s[4]}</span><button class="btn sm ${S.rsvp[s[0]]?'sec':''}" data-act="rsvp" data-k="${s[0]}">${S.rsvp[s[0]]?'In ✓':'I am in'}</button></div></div>`).join('')}
<div class="card"><div class="row"><div class="lab">Poll</div><span class="muted">Closes tomorrow</span></div><b>Sunday run: which start time?</b>${[['a','7:00 am'],['b','8:30 am']].map(o=>`<button class="chip ${p.voted===o[0]?'on':''}" data-act="vote" data-k="${o[0]}" style="text-align:left;padding:0 10px">${o[1]} · ${p[o[0]]} votes</button>${prog(p[o[0]]/tot*100,o[0]==='b')}`).join('')}<div class="muted">The winning time becomes a scheduled run.</div></div>
<button class="card" data-go="event" style="text-align:left;color:inherit;cursor:pointer"><div class="row"><b>Putt Ottam 5K</b><span class="tag gold">Event</span></div><div class="muted">September · ${48+(S.registered?3:0)} registered</div></button>
<button class="card" data-go="tourney" style="text-align:left;color:inherit;cursor:pointer"><div class="row"><b>Winter badminton league</b><span class="tag gold">Tournament</span></div><div class="muted">Quarter-finals this week · 3 divisions</div></button>
<div class="card"><div class="row"><b>Annual Nammal Day</b><span class="tag gold">1 Nov</span></div><div class="muted">Year-end awards from the admins; new Nammal year begins</div></div></div>`};
V.event=()=>`<div class="head"><button class="back" data-go="together">← Back</button><h1>Putt Ottam 5K</h1><div class="sub">Annual Nammal 5K · September · [VENUE]</div></div><div class="main"><div class="ph">Event photo or route map</div><div class="card"><div class="lab">Categories</div>${[['Adults: walk it, run it or race it','5K'],['Teens 14 to 17','5K'],['Ages 8 to 13','1 mile'],['Ages 3 to 7',"Kids' dash"]].map(c=>`<div class="row"><span>${c[0]}</span><span class="tag">${c[1]}</span></div>`).join('')}</div><div class="grid2"><div class="card"><div class="lab">Going</div><div class="big">${48+(S.registered?3:0)} members</div></div><div class="card"><div class="lab">Carpool</div><div class="big">7 seats open</div></div></div><div class="card"><div class="lab">Event share</div><div class="row"><span>Per family</span><b>[AMOUNT]</b></div><div class="muted">Registering adds this to your Wallet.</div></div><button class="btn" data-act="register">${S.registered?'Registered ✓ (tap to undo)':'Register my family'}</button></div>`;
V.tourney=()=>{const m=(a,b,s)=>`<div style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;background:var(--bg)">${a}<br><span class="muted">${b}</span>${s?`<br><span class="gold">${s}</span>`:''}</div>`;return `<div class="head"><button class="back" data-go="together">← Back</button><h1>Winter badminton league</h1><div class="sub">Doubles · seeded by level · best of 3</div></div><div class="main"><div class="card"><div class="lab">Bracket · Level 2 division</div><div class="grid3"><div style="display:flex;flex-direction:column;gap:8px"><div class="muted">Quarter-finals</div>${m('Pair 1','Pair 8','21-15, 21-18')}${m('Pair 4 (you)','Pair 5',S.matchDone?'21-19, 21-17':'Tonight')}${m('Pair 3','Pair 6')}${m('Pair 2','Pair 7')}</div><div style="display:flex;flex-direction:column;gap:8px;justify-content:space-around"><div class="muted">Semi-finals</div>${m('Pair 1',S.matchDone?'Pair 4 (you)':'Winner QF2')}${m('Winner QF3','Winner QF4')}</div><div style="display:flex;flex-direction:column;gap:8px;justify-content:center"><div class="muted">Final</div>${m('Winner SF1','Winner SF2')}</div></div></div><div class="card"><div class="lab">My match</div><div class="row"><b>Pair 4 (you) vs Pair 5</b><span class="tag ${S.matchDone?'ok':''}">${S.matchDone?'Confirmed':'Tonight 7:00'}</span></div><div class="muted">Opponents are one level higher: × ${S.rules.one} points</div><button class="btn sm" data-act="match" ${S.matchDone?'disabled':''}>${S.matchDone?'Score confirmed by both pairs':'Enter score and confirm with opponent'}</button></div><div class="muted">Both pairs confirm the score, so match points are verified at once.</div></div>`};
V.challenge=()=>{const c=CH.find(x=>x.id===S.challenge);return `<div class="head"><button class="back" data-go="me">← Back</button><h1>My challenge</h1><div class="sub">Nammal Fitness Challenges 2027 · one primary challenge each</div></div><div class="main">
<div class="card"><div class="lab">Primary challenge</div><select id="chsel" aria-label="Primary challenge">${CH.map(x=>`<option value="${x.id}" ${x.id===S.challenge?'selected':''}>${x.name}</option>`).join('')}</select><div class="muted">Changing challenge mid-year sends a request to the admins (injury or health reasons).</div></div>
<div class="card"><div class="row"><h2>${c.name}</h2><span class="tag ${c.done?'ok':'pend'}">${c.done?'On track':'Make-up due'}</span></div><div class="row"><span class="muted">Year-end target</span><b>${c.target}</b></div><div class="row"><span class="muted">Now</span><b>${c.priv?(S.showHealth?'Baseline recorded · −3 lb':c.now):c.now}</b></div>${prog(c.pct)}<div class="muted">${c.imp}</div></div>
<div class="card"><div class="lab">Minimum commitment</div><div class="row"><span>${c.min}</span><span class="tag ${c.done?'ok':'pend'}">${c.period}: ${c.done?'met':'not yet'}</span></div>${c.priv?'<div class="muted">Individual challenge. Weight is private to you; only the change in pounds is shared with one admin, with your consent.</div>':'<div class="muted">Group activities count when done with other Nammal members. Proof: Strava sync or a watch or app photo showing distance, time and pace.</div>'}<button class="btn sec sm" data-go="${c.priv?'me':'log'}">${c.priv?'Record a private weigh-in':'Log an activity for this challenge'}</button></div>
<div class="card"><div class="lab">Exceptions</div><div class="grid2"><button class="btn sec sm" data-act="exception" data-k="Vacation exception">Vacation month</button><button class="btn sec sm" data-act="exception" data-k="Challenge change">Change challenge</button></div><div class="muted">${S.exception?S.exception+' request is with the admins.':'Miss one month for vacation and make it up later, with admin approval.'}</div></div>
<div class="card"><div class="row"><div class="lab">Volunteering · 1 activity a year</div><span class="tag ${S.volunteer==='ok'?'ok':S.volunteer==='pend'?'pend':''}">${S.volunteer==='ok'?'Confirmed':S.volunteer==='pend'?'With admin':'Not yet'}</span></div><button class="btn sec sm" data-act="volunteer" ${S.volunteer!=='none'?'disabled':''}>Log a volunteering activity</button></div>
<div class="card"><div class="row"><div class="lab">Commitment contribution</div><span class="tag">Not due</span></div><div class="muted">$100 a year applies to members without an active challenge, or who repeatedly miss it. Admins add it to dues.</div></div></div>`};
V.family=()=>{const stars=S.kids.reduce((a,k)=>a+k.stars,0);return `<div class="head"><button class="back" data-go="me">← Back</button><h1>Family</h1><div class="sub">You manage your children's profiles</div></div><div class="main"><div class="card"><div class="row"><div class="lab">Family score this week</div><span class="tag">3rd of 19 families</span></div><div class="big">${S.verified+stars*10} points</div><div class="muted">Your points + 10 for each kids' star</div></div>${S.kids.map((k,i)=>`<div class="card"><div class="row">${who(k.name,k.band)}<span class="tag ${k.stars>=5?'ok':'pend'}">${k.stars} stars</span></div><div style="display:flex;gap:6px">${[0,1,2,3,4,5,6].map(d=>`<button class="star ${d<k.stars?'on':''}" aria-label="Day ${d+1}" data-act="star" data-k="${i}" data-d="${d}"></button>`).join('')}</div><div class="muted">Daily goal: ${k.goal}. Tap a day to mark it active.</div></div>`).join('')}<div class="card"><div class="lab">Privacy for kids</div>${[['name',"Show first name on kids' board"],['photo','Allow photos on the feed']].map(p=>`<label style="flex-direction:row;justify-content:space-between;align-items:center;min-height:40px;color:var(--cream);font-size:14px">${p[1]}<input type="checkbox" data-act="kidPriv" data-k="${p[0]}" ${S.kidPriv[p[0]]?'checked':''} style="width:20px;min-height:20px"></label>`).join('')}</div></div>`};
V.me=()=>{let cells='';for(let i=0;i<90;i++){const v=(i*7+3)%5;cells+=`<span style="background:${v<2?'#34493A':v<4?'#2E6B3F':'#C9A227'}"></span>`}return `<div class="head"><h1>Me</h1><div class="sub">Sample member · Squad Periyar</div></div><div class="main">
<div class="card"><div class="lab">My levels</div>${Object.keys(TYPE).map(k=>`<div class="row"><span>${TYPE[k]}</span><span class="tag ${k==='tr'&&!S.trApproved?'pend':'ok'}">Level ${S.level[k]} · ${k==='tr'&&!S.trApproved?'awaiting admin':'approved'}</span></div>`).join('')}</div>
<div class="card"><div class="row"><div class="lab">Private health data</div><span class="tag">Only you can see this</span></div>${[['Date of birth, weight','[sample] · [sample]'],['Readiness answers','All clear'],['Heart rate, calories','[sample]']].map(r=>`<div class="row"><span>${r[0]}</span><span class="muted">${S.showHealth?r[1]:'Hidden'}</span></div>`).join('')}<button class="btn sec sm" data-act="health">${S.showHealth?'Hide':'Show to me'}</button></div>
<div class="card"><div class="row"><div class="lab">My year so far</div><span class="muted">Since 1 Nov</span></div><div class="heat">${cells}</div></div>
<div class="grid2"><div class="card"><div class="lab">Streak</div><div class="big">3 weeks</div><div class="muted">2 rest days a week · 1 shield</div></div><div class="card"><div class="lab">Badges</div><div class="big">7 earned</div><div class="muted">Next: Putt Ottam finisher</div></div></div>
<div class="grid2"><button class="btn sec sm" data-go="challenge">My challenge</button><button class="btn sec sm" data-go="family">Family</button><button class="btn sec sm" data-go="wallet">Wallet</button><button class="btn sec sm" data-go="recap">Weekly recap</button><button class="btn sec sm" data-go="explain">How points work</button><button class="btn sec sm" data-act="role" data-k="admin">Admin view</button></div></div>`};
V.wallet=()=>{const due=S.dues.filter(d=>!d.paid).length;return `<div class="head"><button class="back" data-go="me">← Back</button><h1>Wallet</h1><div class="sub">Dues and event shares for your family</div></div><div class="main"><div class="card"><div class="lab">Open items</div><div class="big">${due} due</div></div><div class="card">${S.dues.map(d=>`<div class="row" style="min-height:44px"><div>${d.t}<div class="muted">${d.s}</div></div><span><b>[AMOUNT]</b> <span class="tag ${d.paid?'ok':'pend'}">${d.paid?'Paid':'Due'}</span></span></div>`).join('')}</div><div class="card"><div class="lab">How to pay</div><div>Pay the treasurer by Zelle, cash or card. The treasurer marks it paid in the admin console (try it: Admin view → Finances).</div></div><div class="muted">The app records payments; no money moves through it.</div></div>`};
V.recap=()=>`<div class="head"><button class="back" data-go="me">← Back</button><h1>Your week</h1><div class="sub">Sunday recap · ready to share</div></div><div class="main"><div class="card" style="border-color:var(--gold);align-items:center;gap:12px;padding:18px"><h2>Nammal Fit · Week 2</h2>${ring(S.weekMin/S.goal*100,S.weekMin>=S.goal?'Done':S.weekMin,S.weekMin>=S.goal?'ring closed':'of '+S.goal+' min',124)}<div class="grid3" style="width:100%;text-align:center"><div><div class="big">4</div><div class="muted">active days</div></div><div><div class="big">${S.verified}</div><div class="muted">points</div></div><div><div class="big">${S.weeksClosed}/40</div><div class="muted">annual ring</div></div></div><div style="text-align:center">Squad Periyar: 7 of 9 members on track</div></div><div class="muted">The card shows points and counts only. No health data, no Strava details.</div><button class="btn" data-act="say" data-k="Sharing to WhatsApp is not wired up in the prototype">Share to WhatsApp</button></div>`;
V.explain=()=>{const e=S.ex,base=Math.min(e.min*effVal(e.eff),S.rules.cap),capped=e.min*effVal(e.eff)>S.rules.cap,m=chMult(e.diff,e.lvl),pts=Math.round(base*m),max=S.rules.cap*S.rules.two;
 const D=['','D1 · easy: short walk, gentle class','D2 · light: 2 to 5 mile walk, social game','D3 · solid: 5K run, league match','D4 · hard: 10K, tough opponent','D5 · very hard: half marathon or more'];
 const why=m<1?'This session is below your level, so it counts a little less. Easy days still count.':m===1?'This session matches your level, so you earn the standard amount.':'This session is above your level, so it earns more. Stretching yourself is rewarded.';
 return `<div class="head"><button class="back" data-go="home">← Back</button><h1>How points work</h1><div class="sub">Move the controls and watch the points change</div></div><div class="main">
<div class="card"><div class="lab">1 · The session</div><div class="grid2"><label>Activity<select id="exact">${Object.keys(ACT).map(a=>`<option ${a===e.act?'selected':''}>${a}</option>`).join('')}</select></label><label>Effort (from a device or organizer)<select id="exeff">${[1,2,3].map(x=>`<option value="${x}" ${x===e.eff?'selected':''}>${effName(x)} · ${effVal(x)}/min</option>`).join('')}</select></label></div><label>Minutes: <b style="color:var(--cream)">${e.min}</b><input type="range" id="exmin" min="10" max="120" step="5" value="${e.min}"></label><label>How hard is this session? <b style="color:var(--cream)">${D[e.diff]}</b><input type="range" id="exdiff" min="1" max="5" value="${e.diff}"></label></div>
<div class="card"><div class="lab">2 · You</div><label>My level for ${TYPE[ACT[e.act][0]]}: <b style="color:var(--cream)">Level ${e.lvl}</b><input type="range" id="exlvl" min="1" max="5" value="${e.lvl}"></label></div>
<div class="card" style="border-color:var(--gold)"><div class="lab">3 · Your points</div><div class="row"><span>Effort: ${e.min} min × ${effVal(e.eff)}${capped?' (daily cap '+S.rules.cap+')':''}</span><b>${base}</b></div><div class="row"><span>Challenge for a Level ${e.lvl}</span><b>× ${m}</b></div><div class="row"><b>Points</b><b class="gold" style="font-size:24px">${pts}</b></div>${prog(pts/max*100)}<div>${why}</div></div>
<div class="card"><div class="lab">Same session, every level</div>${[1,2,3,4,5].map(l=>{const p=Math.round(base*chMult(e.diff,l));return `<div class="lvlbar"><span class="${l===e.lvl?'gold':''}">Level ${l}${l===e.lvl?' · you':''}</span>${prog(p/max*100,l!==e.lvl)}<b>${p}</b></div>`}).join('')}<div class="muted">A beginner earns more than an elite athlete for the same session, because it is harder for them. Weight, age and pace are never used.</div></div>
<div class="card"><div class="lab">Try these</div><div class="grid2"><button class="btn sec sm" data-act="preset" data-k="beg">Beginner's brisk walk</button><button class="btn sec sm" data-act="preset" data-k="elite">Marathoner's easy run</button><button class="btn sec sm" data-act="preset" data-k="race">Marathoner's race day</button><button class="btn sec sm" data-act="preset" data-k="bad">Tournament match</button></div></div>
<div class="card"><div class="lab">Good to know</div><div>• No device or organizer check? An admin reviews the entry and awards the points.</div><div>• Close your weekly ring for +${S.rules.goalBonus} points, at every level.</div><div>• Admins can change every number here (Admin view → Rules).</div></div></div>`};

// ---------- admin ----------
const A={};
A.Dashboard=()=>`<h1>Group health</h1><div class="sub">Week 2 of Winter season · sample data</div><div class="tiles">${[['Health score','74 / 100','ok','On track'],['Weekly participation','68%','pend','Watch'],['Weekly rings closed','52%','ok','On track'],['Challenge minimums met','71%','pend','Watch'],['At-risk members','6','warn','Act'],['Waiting for admin',S.queue.length+(S.exception?1:0)+(S.volunteer==='pend'?1:0)+(S.trApproved?0:1),'pend','Review']].map(t=>`<div class="card"><div class="lab">${t[0]}</div><div style="font-size:24px;font-weight:600">${t[1]}</div><span class="tag ${t[2]}" style="align-self:flex-start">${t[3]}</span></div>`).join('')}</div><div class="lab">Squads</div><div class="tbl"><table><tr><th>Squad</th><th>Members</th><th>Avg points</th><th>Rings closed</th><th>Health</th></tr>${[['Periyar',9,286,'67%','ok','On track'],['Pamba',8,271,'63%','ok','On track'],['Nila',10,240,'50%','pend','Watch'],['Kabini',7,188,'29%','warn','Act']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="tag ${r[4]}">${r[5]}</span></td></tr>`).join('')}</table></div><div class="muted">Health data is never shown here: activity, points and attendance only.</div>`;
A.Verify=()=>`<h1>Verification queue</h1><div class="sub">Self-reported activity waits here for an admin to award points. QR, partner and synced entries skip the queue.</div><div class="tbl"><table><tr><th>Member</th><th>Activity</th><th>Minutes</th><th>Evidence</th><th>Points</th><th>Action</th></tr>${S.queue.length?S.queue.map(q=>`<tr><td>${q.who}</td><td>${q.act}</td><td>${q.min}</td><td>${q.ev}</td><td><button class="pill" data-act="adj" data-k="${q.id}" data-d="-10" aria-label="Lower points">−</button> <b>${q.pts}</b> <button class="pill" data-act="adj" data-k="${q.id}" data-d="10" aria-label="Raise points">+</button></td><td><button class="btn sm" data-act="award" data-k="${q.id}">Award</button> <button class="btn sec sm" data-act="reject" data-k="${q.id}">Reject</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">Queue is clear. Log an activity as a member with "Watch or app photo" to see one arrive.</td></tr>'}</table></div>
<div class="lab">Levels, exceptions and volunteering</div><div class="tbl"><table><tr><th>Member</th><th>Request</th><th>Detail</th><th>Action</th></tr>${S.trApproved?'':`<tr><td>You</td><td>Level approval</td><td>Training and classes · Level 1 · 4 questions answered</td><td><button class="btn sm" data-act="approveLvl">Approve</button></td></tr>`}${S.exception?`<tr><td>You</td><td>${S.exception}</td><td>${CH.find(x=>x.id===S.challenge).name}</td><td><button class="btn sm" data-act="approveEx">Approve</button></td></tr>`:''}${S.volunteer==='pend'?`<tr><td>You</td><td>Volunteering</td><td>Helped with event setup</td><td><button class="btn sm" data-act="approveVol">Confirm</button></td></tr>`:''}<tr><td>Member M</td><td>Level approval</td><td>Endurance · Level 4 · Strava link (opens in Strava)</td><td><button class="btn sm" data-act="say" data-k="Approved (sample row)">Approve</button></td></tr></table></div>`;
A.Challenges=()=>`<h1>Fitness Challenges 2027</h1><div class="sub">One primary challenge per member; monthly or quarterly minimums</div><div class="tiles">${CH.map((c,i)=>`<div class="card"><div class="lab">${c.name}</div><div class="big">${[10,18,7,14,5,4,6,26][i]} members</div><div class="muted">${c.target}</div></div>`).join('')}</div><div class="lab">Compliance this period</div><div class="tbl"><table><tr><th>Member</th><th>Challenge</th><th>Minimum</th><th>Status</th></tr>${S.members.map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td><td><span class="tag ${m[3]==='On track'?'ok':'pend'}">${m[3]}</span></td></tr>`).join('')}</table></div><div class="muted">Weight management shows only whether a weigh-in was recorded. The weight itself stays private to the member.</div>`;
A.Rules=()=>{const f=(k,l)=>`<label>${l}<input type="number" step="0.05" data-rule="${k}" value="${S.rules[k]}"></label>`;return `<h1>Points rules</h1><div class="sub">Change a value, then open "How points work" as a member to see the effect</div><div class="card"><div class="lab">Effort values (points per minute)</div><div class="grid4">${f('light','Light')}${f('mod','Moderate')}${f('vig','Vigorous')}${f('cap','Daily cap')}</div></div><div class="card"><div class="lab">Challenge multipliers</div><div class="grid4">${f('below','Below level')}${f('at','At level')}${f('one','One above')}${f('two','Two or more above')}</div></div><div class="card"><div class="lab">Bonuses</div><div class="grid4">${f('goalBonus','Weekly ring closed')}</div></div><div class="muted">In the real app each change is saved as a new rule version with an effective date; past points never change.</div>`};
A.Finances=()=>`<h1>Finances</h1><div class="sub">Dues, event shares and commitment contributions, tracked from day one</div><div class="tbl"><table><tr><th>Member</th><th>Item</th><th>Amount</th><th>Status</th><th>Action</th></tr>${S.dues.map((d,i)=>`<tr><td>You</td><td>${d.t}</td><td>[AMOUNT]</td><td><span class="tag ${d.paid?'ok':'pend'}">${d.paid?'Paid':'Due'}</span></td><td><button class="btn sec sm" data-act="pay" data-k="${i}">${d.paid?'Mark unpaid':'Mark paid'}</button></td></tr>`).join('')}<tr><td>Member F</td><td>Commitment contribution (no challenge)</td><td>$100</td><td><span class="tag pend">Due</span></td><td><button class="btn sec sm" data-act="say" data-k="Marked paid (sample row)">Mark paid</button></td></tr></table></div><div class="muted">The treasurer records payments made by Zelle, cash or card. No money moves through the app.</div>`;
A.Events=()=>`<h1>Events</h1><div class="sub">Signature events for the Nammal year</div><div class="tbl"><table><tr><th>Event</th><th>When</th><th>Registered</th><th>Notes</th></tr><tr><td>Annual Nammal Day</td><td>1 November</td><td>—</td><td>Admins decide and give the prizes</td></tr><tr><td>Turkey Trot</td><td>November</td><td>31</td><td>Team challenge running now</td></tr><tr><td>Putt Ottam 5K</td><td>September</td><td>${48+(S.registered?3:0)}</td><td>Kids' dash for every age band</td></tr><tr><td>Winter badminton league</td><td>Nov to Feb</td><td>24 pairs</td><td>3 divisions by level</td></tr></table></div>`;

// ---------- actions ----------
const X={
 finishOnboard(){S.signed=true;go('home');toast('Welcome! Your level is with the admins for approval')},
 rsvp(d){S.rsvp[d.k]=!S.rsvp[d.k];render()},
 setAct(d){S.log.act=d.k;render()},
 setMethod(d){S.log.method=d.k;render()},
 saveLog(){const l=S.log,c=calcLog(),what=`${l.act} · ${l.min} min`;if(c.ok){addMinutes(l.min,c.pts);S.feed.unshift({who:'You',what,pts:c.pts,ok:true,cheers:0});toast('Verified: +'+c.pts+' points')}else{const id=S.nextId++;S.queue.push({id,who:'You',act:l.act,min:l.min,ev:l.method==='photo'?'Photo':'None',pts:c.pts});S.feed.unshift({who:'You',what,pts:c.pts,ok:false,cheers:0,qid:id,photo:l.method==='photo'});toast('Sent to an admin. Switch to Admin view → Verify to award it')}go('feed')},
 cheer(d){S.feed[d.k].cheers++;render()},
 vote(d){const p=S.poll;if(p.voted)p[p.voted]--;p.voted=d.k;p[d.k]++;render()},
 register(){S.registered=!S.registered;if(S.registered)S.dues.unshift({t:'Putt Ottam 5K',s:'Family registration',paid:false});else S.dues=S.dues.filter(x=>x.t!=='Putt Ottam 5K');render();toast(S.registered?'Registered. Event share added to Wallet':'Registration removed')},
 match(){S.matchDone=true;const p=Math.round(Math.min(60*S.rules.vig,S.rules.cap)*S.rules.one)+20;addMinutes(60,p);S.feed.unshift({who:'You',what:'Badminton · tournament match won',pts:p,ok:true,cheers:0});render();toast('Score confirmed by both pairs: +'+p+' points')},
 exception(d){S.exception=d.k;render();toast(d.k+' request sent to the admins')},
 volunteer(){S.volunteer='pend';render();toast('Volunteering logged. An admin will confirm it')},
 star(d){const k=S.kids[d.k],n=+d.d+1;k.stars=k.stars===n?n-1:n;render()},
 kidPriv(d){S.kidPriv[d.k]=!S.kidPriv[d.k]},
 health(){S.showHealth=!S.showHealth;render()},
 say(d){toast(d.k)},
 role(d){S.role=d.k;if(d.k==='member'&&!S.signed){S.signed=true;route='home'}render();window.scrollTo(0,0)},
 atab(d){S.adminTab=d.k;render()},
 preset(d){S.ex={beg:{act:'Walk',min:45,eff:2,diff:2,lvl:1},elite:{act:'Run',min:50,eff:2,diff:3,lvl:5},race:{act:'Run',min:110,eff:3,diff:5,lvl:5},bad:{act:'Badminton',min:60,eff:3,diff:4,lvl:2}}[d.k];render()},
 adj(d){const q=S.queue.find(x=>x.id==d.k);q.pts=Math.max(0,q.pts+ +d.d);render()},
 award(d){const q=S.queue.find(x=>x.id==d.k);S.queue=S.queue.filter(x=>x!==q);const f=S.feed.find(x=>x.qid===q.id)||S.feed.find(x=>x.who===q.who&&!x.ok);if(f){f.ok=true;f.pts=q.pts}if(q.who==='You')addMinutes(q.min,q.pts);render();toast('Awarded '+q.pts+' points to '+q.who)},
 reject(d){const q=S.queue.find(x=>x.id==d.k);S.queue=S.queue.filter(x=>x!==q);S.feed=S.feed.filter(x=>!(x.qid===q.id||(x.who===q.who&&!x.ok&&q.who!=='You')));render();toast('Entry rejected')},
 approveLvl(){S.trApproved=true;render();toast('Level approved')},
 approveEx(){toast(S.exception+' approved');S.exception=null;render()},
 approveVol(){S.volunteer='ok';render();toast('Volunteering confirmed')},
 pay(d){S.dues[d.k].paid=!S.dues[d.k].paid;render()},
 reset(){location.hash='';location.reload()}
};
function go(r){route=r;try{history.replaceState(null,'','#'+r)}catch(e){}render();window.scrollTo(0,0)}
const TABS=[['home','Home'],['together','Together'],['log','Log'],['boards','Boards'],['me','Me']];
const tabOf={feed:'home',explain:'home',event:'together',tourney:'together',family:'me',wallet:'me',recap:'me',challenge:'me'};
function render(){
 const bar=`<div class="bar"><b>Nammal Fit prototype</b><span class="muted">Sample data · nothing is saved</span><button class="pill ${S.role==='member'?'on':''}" data-act="role" data-k="member">Member app</button><button class="pill ${S.role==='admin'?'on':''}" data-act="role" data-k="admin">Admin console</button><button class="pill" data-act="reset">Reset</button></div>`;
 let body;
 if(S.role==='admin'){body=`<div class="admin"><nav aria-label="Admin"><h2 style="padding:0 12px 10px">Nammal Fit admin</h2>${Object.keys(A).map(k=>`<button class="${S.adminTab===k?'on':''}" data-act="atab" data-k="${k}">${k}</button>`).join('')}</nav><main>${A[S.adminTab]()}</main></div>`}
 else{if(!V[route])route='home';if(!S.signed&&route!=='signin'&&route!=='onboard')route='signin';const act=tabOf[route]||route;body=`<div class="phone">${V[route]()}${S.signed?`<nav class="tabs" aria-label="Main">${TABS.map(t=>`<button class="${act===t[0]?'on':''}" data-go="${t[0]}"><i style="${t[0]==='log'?'border-radius:50%':''}"></i>${t[1]}</button>`).join('')}</nav>`:''}</div>`}
 $('#app').innerHTML=bar+body;
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const a=e.target.closest('[data-act]');if(a&&a.tagName!=='INPUT'&&X[a.dataset.act])X[a.dataset.act](a.dataset)});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='lmin'){S.log.min=Math.max(5,+t.value||5);render()}
 else if(t.id==='lmi'){S.log.miles=+t.value}
 else if(t.id==='chsel'){S.challenge=t.value;render();toast('In the real app this change needs admin approval')}
 else if(t.id==='exact'){S.ex.act=t.value;S.ex.eff=ACT[t.value][1];render()}
 else if(t.id==='exeff'){S.ex.eff=+t.value;render()}
 else if(t.dataset.rule){S.rules[t.dataset.rule]=+t.value;toast('Rule updated')}
 else if(t.dataset.act==='kidPriv'){X.kidPriv(t.dataset)}});
document.addEventListener('input',e=>{const t=e.target,m={exmin:'min',exdiff:'diff',exlvl:'lvl'}[t.id];if(m){S.ex[m]=+t.value;const y=window.scrollY;render();window.scrollTo(0,y);const n=document.getElementById(t.id);if(n)n.focus()}});
const h=(location.hash||'').slice(1);if(h==='admin'){S.role='admin';S.signed=true}else if(h&&V[h]&&h!=='signin'){S.signed=true;route=h}
render();
</script>
</body>
</html>
